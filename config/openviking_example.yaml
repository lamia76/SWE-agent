# 使用 OpenViking Proxy 的示例配置
# 复制 default 配置后，在 bundles 中添加 tools/openviking_proxy
# 使用前请先启动 proxy_server.py
agent:
  templates:
    system_template: |-
      You are a helpful assistant that can interact with a computer to solve tasks.
      You have access to OpenViking tools to read and search context from a knowledge base.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a python code repository in the directory {{working_dir}}.

      <pr_description>
      {{problem_statement}}
      </pr_description>

      Can you help implement the necessary changes?
      Use openviking_read, openviking_search, or user_memory_search when you need to
      look up context from OpenViking.
    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/openviking_proxy
    propagate_env_variables:
      - OPENVIKING_PROXY_URL
    registry_variables:
      USE_FILEMAP: 'true'
    enable_bash_tool: true
    parse_function:
      type: function_calling
