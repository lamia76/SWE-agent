{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "root_api_key": "sk-1234",
  },
  "storage": {
    "vectordb": {
      "name": "context",
      "backend": "local",
      "path": "./data",
      "volcengine": {
        "region": "cn-beijing",
        "ak": null,
        "sk": null
      }
    },
    "agfs": {
      "port": 8080,
      "log_level": "warn",
      "path": "./data",
      "backend": "local",
      "timeout": 10,
      "retry_times": 3
    }
  },
  "embedding": {
    "dense": {
      "model": "qwen3-embedding",
      "api_key": "sk-1234",
      "api_base": "http://141.61.16.3:8002/v1",
      "backend": "volcengine",
      "dimension": 1024,
      "input": "text"
    }
  },
  "vlm": {
    "model": "glm-4.5-air",
    "api_key": "sk-1234",
    "api_base": "http://141.61.16.3:10193/v1",
    "temperature": 0.0,
    "max_retries": 2,
    "backend": "openai"
  },
  "rerank": {
    "ak": null,
    "sk": null,
    "host": "api-vikingdb.vikingdb.cn-beijing.volces.com",
    "model_name": "doubao-seed-rerank",
    "model_version": "251028",
    "threshold": 0.1
  },
  "auto_generate_l0": false,
  "auto_generate_l1": false,
  "default_search_mode": "thinking",
  "default_search_limit": 3,
  "enable_memory_decay": true,
  "memory_decay_check_interval": 3600,
  "parsers": {
    "code": {
      "enable_ast": true,
      "extract_functions": true,
      "extract_classes": true,
      "extract_imports": true,
      "include_comments": true,
      "max_line_length": 1000,
      "max_token_limit": 50000,
      "truncation_strategy": "head",
      "warn_on_truncation": true
    },
    "text": {
      "detect_language": true,
      "split_by_paragraphs": true,
      "max_paragraph_length": 1000,
      "preserve_line_breaks": false
    }
  }
}
