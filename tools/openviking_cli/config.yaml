# CLI 方式：通过 ov 命令连接 OpenViking Server（HTTP），配置 ovcli.conf 的 url
tools:
  ov_index_repo:
    signature: "ov_index_repo <repo_path> [<wait>]"
    docstring: "索引目标仓库到OpenViking数据库，用于语义搜索。首次使用时必须执行此命令。默认只上传资源（快速）；加 wait=true 会等待服务端队列完成（ov_find 立即可用）。不加 wait 时，ov_find 前需先 ov_wait。需配置 ovcli.conf 的 url。"
    arguments:
      - name: repo_path
        type: string
        description: "仓库路径或 URL（如 https://github.com/owner/repo 或 . 表示当前目录）"
        required: false
        argument_format: "{{value}}"
      - name: wait
        type: boolean
        description: "是否在 add-resource 后等待服务端队列完成（默认否；设为 true 则 ov_find 立即可用）"
        required: false
        argument_format: "--wait"

  ov_wait:
    signature: "ov_wait [<timeout>]"
    docstring: "等待OpenViking完成所有后台处理操作。首次索引后或添加大量文件后建议执行，确保数据库就绪后再进行搜索。"
    arguments:
      - name: timeout
        type: integer
        description: "最大等待时间（秒，默认300）"
        required: false
        argument_format: "--timeout {{value}}"

  ov_find:
    signature: "ov_find <query> [<k>] [<score-threshold>]"
    docstring: "在索引的仓库中进行语义搜索。使用前须已 ov_index_repo；若未用 --wait 则需先 ov_wait。total 为 0 时执行 ov_wait 或稍后再搜。返回 URI 与分数；可用 ov_abstract / ov_overview / ov_read 深入查看。"
    arguments:
      - name: query
        type: string
        description: "搜索查询，描述你要查找的内容（如'authentication error', 'test for user login'）"
        required: true
      - name: k
        type: integer
        description: "返回结果数量（默认10）"
        required: false
        argument_format: "-k {{value}}"
      - name: score-threshold
        type: float
        description: "最小相关性分数（0.0-1.0，默认不过滤）"
        required: false
        argument_format: "--score-threshold {{value}}"

  ov_abstract:
    signature: "ov_abstract <uri> [<max-chars>]"
    docstring: "获取文件或目录的极简摘要（L0层级），用于快速判断相关性。建议在对ov_find的结果进行初步筛选时使用。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认1000）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_overview:
    signature: "ov_overview <uri> [<max-chars>]"
    docstring: "获取文件或目录的结构化概览（L1层级），提供比abstract更详细的理解。如需完整内容请使用ov_read。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认8192）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_read:
    signature: "ov_read <uri> [<max-chars>]"
    docstring: "读取文件的完整内容（L2层级）。应谨慎使用，仅针对1-2个最相关的文件。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认16000）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_ls:
    signature: "ov_ls [<uri>] [<simple>] [<recursive>]"
    docstring: "列出指定URI下的目录内容。用于探索目录结构、在特定目录下查找文件或导航已索引的仓库上下文。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（默认viking://）"
        required: false
        argument_format: "{{value}}"
      - name: simple
        type: boolean
        description: "仅返回相对路径（简化输出）"
        required: false
        argument_format: "--simple"
      - name: recursive
        type: boolean
        description: "递归列出所有子目录"
        required: false
        argument_format: "--recursive"

  ov_glob:
    signature: "ov_glob <pattern> [<uri>]"
    docstring: "在已索引的仓库中按模式查找文件。支持glob模式（如'**/*.py'）。可与ov_find结合实现语义+模式混合发现策略。"
    arguments:
      - name: pattern
        type: string
        description: "Glob匹配模式（如'**/*.py'、'**/test_*.py'）"
        required: true
        argument_format: "{{value}}"
      - name: uri
        type: string
        description: "搜索范围URI（默认viking://）"
        required: false
        argument_format: "--uri {{value}}"
