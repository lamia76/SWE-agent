tools:
  ov_index_repo:
    signature: "ov_index_repo <repo_path>"
    docstring: "索引目标仓库到OpenViking数据库，用于语义搜索。首次使用时必须执行此命令，后续添加大量新文件后也应重新索引。索引进度完成后，可以使用ov_find进行语义搜索。"
    arguments:
      - name: repo_path
        type: string
        description: "仓库的github url（如https://github.com/MiniMax-AI/MiniMax-M2）"
        required: false
        argument_format: "{{value}}"

  ov_wait:
    signature: "ov_wait [<timeout>]"
    docstring: "等待OpenViking完成所有后台处理操作。首次索引后或添加大量文件后建议执行，确保数据库就绪后再进行搜索。"
    arguments:
      - name: timeout
        type: integer
        description: "最大等待时间（秒，默认300）"
        required: false
        argument_format: "--timeout {{value}}"

  ov_find:
    signature: "ov_find <query> [<k>] [<score-threshold>]"
    docstring: "在索引的仓库中进行语义搜索，查找相关的文件或目录。使用该工具之前必须确保已经调用过ov_index_repo对目标仓库进行索引。这是定位代码、配置或测试入口的首选工具。返回结果包含URI和相关性分数。建议对前3-5个结果使用ov_abstract快速判断相关性，再使用ov_overview或ov_read深入查看。"
    arguments:
      - name: query
        type: string
        description: "搜索查询，描述你要查找的内容（如'authentication error', 'test for user login'）"
        required: true
      - name: k
        type: integer
        description: "返回结果数量（默认10）"
        required: false
        argument_format: "-k {{value}}"
      - name: score-threshold
        type: float
        description: "最小相关性分数（0.0-1.0，默认不过滤）"
        required: false
        argument_format: "--score-threshold {{value}}"

  ov_abstract:
    signature: "ov_abstract <uri> [<max-chars>]"
    docstring: "获取文件或目录的极简摘要（L0层级），用于快速判断相关性。摘要通常小于1000字符。建议在对ov_find的结果进行初步筛选时使用。如果相关性较高，再使用ov_overview获取结构化概览。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认1000）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_overview:
    signature: "ov_overview <uri> [<max-chars>]"
    docstring: "获取文件或目录的结构化概览（L1层级），提供比abstract更详细的理解。默认最多返回8192字符。用于在确认相关性后，快速了解文件结构、主要函数或类定义。如果需要完整内容，请使用ov_read。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认8192）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_read:
    signature: "ov_read <uri> [<max-chars>]"
    docstring: "读取文件的完整内容（L2层级）。这是最深层的加载方式，应谨慎使用，仅针对1-2个最相关的文件。默认最多返回16000字符，建议根据需要调整max_chars参数。对于超大文件，可结合ov_find定位特定区域。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（如viking://file.py）"
        required: true
        argument_format: "{{value}}"
      - name: max-chars
        type: integer
        description: "最大返回字符数（默认16000）"
        required: false
        argument_format: "--max-chars {{value}}"

  ov_ls:
    signature: "ov_ls [<uri>] [<simple>] [<recursive>]"
    docstring: "列出指定URI下的目录内容。用于探索目录结构、在特定目录下查找文件或导航已索引的仓库上下文。可与ov_find结合使用以实现更精确的文件发现。"
    arguments:
      - name: uri
        type: string
        description: "OpenViking URI（默认viking://）"
        required: false
        argument_format: "{{value}}"
      - name: simple
        type: boolean
        description: "仅返回相对路径（简化输出）"
        required: false
        argument_format: "--simple"
      - name: recursive
        type: boolean
        description: "递归列出所有子目录"
        required: false
        argument_format: "--recursive"

  ov_glob:
    signature: "ov_glob <pattern> [<uri>]"
    docstring: "在已索引的仓库中按模式查找文件。支持glob模式（如'**/*.py'用于递归查找所有Python文件）。用于定位特定类型的文件、在目录中查找测试文件或发现配置文件。可与ov_find结合实现语义+模式混合发现策略。"
    arguments:
      - name: pattern
        type: string
        description: "Glob匹配模式（如'**/*.py'、'**/*.md'、'**/test_*.py'）"
        required: true
        argument_format: "{{value}}"
      - name: uri
        type: string
        description: "搜索范围URI（默认viking://）"
        required: false
        argument_format: "--uri {{value}}"